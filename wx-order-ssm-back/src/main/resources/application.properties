# 微信点餐系统数据库连接配置


spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# 服务器配置
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
# 关键：URI编码设为UTF-8，否则中文路径图片无法访问
server.tomcat.uri-encoding=UTF-8

# 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/wechat_ordering?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=hui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 数据库连接池配置（使用Druid）
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.validation-query=select 1

# MyBatis 配置
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
mybatis.type-aliases-package=com.wechat.ordering.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.auto-mapping-behavior=partial

# 日志配置
logging.level.root=INFO
logging.level.com.wechat.ordering=DEBUG
logging.level.org.mybatis=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring HTTP编码（确保中文路径正确解析）
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Jackson 配置
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=GMT+8

# 应用名称
spring.application.name=wx-order-system

# 图片等静态资源的访问基础URL（队友联调时把localhost换成你的局域网IP，如 http://192.168.1.5:8080/api）
# 本机测试用 localhost，真机调试用局域网IP
app.base-url=http://192.168.79.146:8080/api

# 大模型API配置（AI个性化推荐 - 豆包大模型 OpenAI兼容接口）
ai.api.url=https://ark.cn-beijing.volces.com/api/v3/chat/completions
ai.api.key=ark-9284a3f1-c56c-48ff-9143-68b520f6ce32-0623f
ai.api.model=ep-20260703214014-lg8g2

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA配置（保留用于未来扩展）
spring.jpa.database=MYSQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


